name: reweu_business
description: "Reweu Business Companion & Incident Manager mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing & Deep Linking
  go_router: ^14.8.1

  # Network & Serialization
  dio: ^5.4.0
  json_annotation: ^4.9.0

  # Storage & Biometrics
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.6
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1

  # Push Notifications
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.3.0

  # Localization & Utilities
  easy_localization: ^3.0.7
  intl: any
  url_launcher: ^6.3.2

  # UI, Fonts & Motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.2
  package_info_plus: ^10.2.2
  firebase_crashlytics: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/languages/
    - assets/images/

# iOS app icon (Android already ships branded adaptive icons).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0F172A"

# Launch screens on both platforms.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0A"
  image: assets/images/logo.png
  android_12:
    color: "#0A0A0A"
    image: assets/images/splash_android12.png
    icon_background_color: "#0F172A"
  ios_content_mode: scaleAspectFit
  fullscreen: false
