name: reweu_business
description: "Reweu Business Companion & Incident Manager mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing & Deep Linking
  go_router: ^14.8.1

  # Network & Serialization
  dio: ^5.4.0
  json_annotation: ^4.9.0

  # Storage & Biometrics
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.6
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1

  # Push Notifications
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.3.0

  # Localization & Utilities
  easy_localization: ^3.0.7
  intl: any
  url_launcher: ^6.3.2

  # UI, Fonts & Motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/languages/
    - assets/images/
