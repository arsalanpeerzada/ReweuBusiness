name: Production Deploy (Play Store & App Store)

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      android_track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      deploy_android:
        description: 'Deploy to Google Play'
        required: true
        default: true
        type: boolean
      deploy_ios:
        description: 'Deploy to TestFlight / App Store'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  DEFAULT_API_BASE_URL: 'https://api.reweu.app'

jobs:
  # -------------------------------------------------------------
  # 1. Quality & Test Gate
  # -------------------------------------------------------------
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/lcov.info

  # -------------------------------------------------------------
  # 2. Android: Build AAB & Upload to Google Play
  # -------------------------------------------------------------
  android_release:
    name: Android Build & Play Store Deploy
    needs: verify
    if: github.event_name == 'push' || inputs.deploy_android == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configured."
          else
            echo "GOOGLE_SERVICES_JSON secret not provided; building without Firebase Services config."
          fi

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.REWEU_BUSINESS_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.REWEU_BUSINESS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.REWEU_BUSINESS_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.REWEU_BUSINESS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release keystore secret is not set (KEYSTORE_BASE64)."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "REWEU_KEYSTORE_PATH=upload-keystore.jks" >> "$GITHUB_ENV"
          echo "REWEU_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "REWEU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "REWEU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android App Bundle (AAB)
        env:
          API_URL: ${{ vars.API_BASE_URL || env.DEFAULT_API_BASE_URL }}
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reweu-partners-android-bundle
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/symbols

      - name: Check Google Play Credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_CONFIG_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "PLAY_DEPLOY_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Google Play Console
        if: env.PLAY_DEPLOY_READY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.teniqs.reweu_partners
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.android_track || 'internal' }}
          status: completed

  # -------------------------------------------------------------
  # 3. iOS: Build IPA & Upload to App Store Connect / TestFlight
  # -------------------------------------------------------------
  ios_release:
    name: iOS Build & App Store Deploy
    needs: verify
    if: github.event_name == 'push' || inputs.deploy_ios == true
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Firebase (GoogleService-Info.plist)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist configured."
          else
            echo "::error::GOOGLE_SERVICE_INFO_PLIST secret is not set."
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod repo update
            pod install
            cd ..
          else
            echo "No ios/Podfile found (using Swift Package Manager); skipping CocoaPods."
          fi

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-runner-keychain-pass' }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::warning::Apple Certificate or Provisioning Profile secrets not set. Skipping signed iOS export."
            echo "SKIP_CODESIGN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import .p12 certificate
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build Flutter iOS App
        env:
          API_URL: ${{ vars.API_BASE_URL || env.DEFAULT_API_BASE_URL }}
        run: |
          flutter build ios --release \
            --obfuscate --split-debug-info=build/ios/outputs/symbols \
            --build-number=${{ github.run_number }} \
            --no-codesign \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Archive and Export IPA
        if: env.SKIP_CODESIGN != 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'WKR8WPXR7R' }}
        run: |
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          PROFILE_UUID=$(grep -a -A 1 '<key>UUID</key>' "$PROFILE_PATH" | grep string | sed -e 's/<[^>]*>//g' | tr -d '[:space:]')
          
          # Generate ExportOptions.plist
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.teniqs.reweupartners</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Inject signing settings specifically for Release configuration
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> ios/Flutter/Release.xcconfig

          # Archive using Xcode
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive

          # Export to IPA
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

          find build/ios/ipa -name "*.ipa" -exec mv {} build/ios/ipa/ReweuPartners.ipa \;

      - name: Upload iOS IPA Artifact
        if: env.SKIP_CODESIGN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reweu-partners-ios-ipa
          path: build/ios/ipa/ReweuPartners.ipa

      - name: Check App Store Connect Credentials
        if: env.SKIP_CODESIGN != 'true'
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -n "$APPSTORE_KEY" ]; then
            echo "APPSTORE_DEPLOY_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy to TestFlight / App Store Connect
        if: env.SKIP_CODESIGN != 'true' && env.APPSTORE_DEPLOY_READY == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/ipa/ReweuPartners.ipa'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
